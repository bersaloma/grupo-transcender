<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Placas · Grupo Transcender</title>
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
  :root{--titulo:#1A78AE;--rosa-forte:#D14F8A;--indigo:#174A6B}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"Inter",system-ui,sans-serif;overflow:hidden;cursor:pointer;user-select:none;-webkit-user-select:none}
  .placa{position:fixed;inset:0;display:grid;place-items:center;padding:24px 24px 56px;text-align:center;
    background:radial-gradient(120% 90% at 15% 10%,#D9F3FE 0%,transparent 55%),radial-gradient(120% 90% at 85% 90%,#FCE1EC 0%,transparent 55%),#FFF8FB}
  .placa.fim{background:radial-gradient(120% 90% at 15% 10%,#FCD5E4 0%,transparent 55%),radial-gradient(120% 90% at 85% 90%,#F5A9B8 0%,transparent 60%),#FFEFF5}
  .placa-in{max-width:1000px;display:flex;flex-direction:column;align-items:center;animation:entra .3s ease-out}
  .logo{width:clamp(56px,min(10vw,12vh),120px);aspect-ratio:1;margin:0 0 10px;background:url(assets/logo.png) center/contain no-repeat}
  h1{font-family:"DM Serif Display",Georgia,serif;font-weight:400;font-size:clamp(30px,min(9.5vw,14vh),140px);line-height:1.05;color:var(--titulo);margin-top:14px;max-width:100%;text-wrap:balance;overflow-wrap:break-word}
  .placa{overflow:auto}
  .placa-in{max-width:min(1000px,100%)}
  .fim h1{color:var(--rosa-forte)}
  p{font-size:clamp(18px,min(2.8vw,4vh),34px);line-height:1.4;color:var(--indigo);margin-top:18px;max-width:22em}
  p:empty{display:none}
  .dica{position:fixed;bottom:16px;left:0;right:0;text-align:center;font-size:15px;font-weight:700;color:var(--indigo);transition:opacity .6s}
  .dica.some{opacity:0}
  @keyframes entra{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
  .aviso-f11{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:10px 12px 10px 14px;box-shadow:0 18px 40px -16px rgba(23,74,107,.5);border:2px solid #5BCEFA;cursor:default;animation:f11In .35s ease-out;max-width:calc(100vw - 24px)}
  .aviso-f11[hidden]{display:none}
  .aviso-f11 p{font-size:16px;line-height:1.4;color:var(--indigo);font-weight:700}
  .aviso-f11 kbd{font-family:inherit;font-size:14px;font-weight:800;background:#EEF6FD;border:2px solid #CFE3F2;border-bottom-width:3px;border-radius:8px;padding:1px 7px;white-space:nowrap}
  .f11-ico{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:18px;color:#fff;background:linear-gradient(135deg,#5BCEFA,#F5A9B8)}
  .f11-ok{flex:none;cursor:pointer;border:2px solid #F5A9B8;background:#FCE1EC;color:var(--indigo);font:inherit;font-size:14px;font-weight:800;border-radius:999px;padding:8px 14px}
  .f11-x{flex:none;cursor:pointer;border:0;background:none;width:34px;height:34px;border-radius:50%;color:var(--indigo);font-size:16px}
  .f11-x:hover{background:#FAD3DE}
  @keyframes f11In{from{opacity:0;transform:translate(-50%,-14px)}to{opacity:1;transform:translate(-50%,0)}}
</style>
</head>
<body>
<div class="placa" id="placa">
  <div class="placa-in" id="placa-in">
    <div class="logo" role="presentation"></div>
    <h1 id="tit">Faltam 2 minutos</h1>
    <p id="sub"></p>
  </div>
</div>
<div class="dica" id="dica">Clique na tela para trocar de placa</div>
<div class="aviso-f11" id="aviso-f11" role="status" hidden>
  <span class="f11-ico" aria-hidden="true">⛶</span>
  <p>Aperte <kbd id="f11-tecla">F11</kbd> para usar a tela cheia.</p>
  <button class="f11-ok" id="f11-agora">Ativar agora</button>
  <button class="f11-x" id="f11-fechar" aria-label="Fechar aviso">✕</button>
</div>
<script>
  const PLACAS = [
    { t: "Faltam 2 minutos", s: "", fim: false },
    { t: "Seu tempo acabou", s: "Agradecemos a sua partilha. Por favor, conclua para que outras pessoas também possam partilhar.", fim: true }
  ];
  let atual = new URLSearchParams(location.search).get("p") === "fim" ? 1 : 0;
  const $ = s => document.querySelector(s);
  function mostrar(i){
    atual = (i + PLACAS.length) % PLACAS.length;
    const d = PLACAS[atual];
    $("#tit").textContent = d.t;
    $("#sub").textContent = d.s;
    $("#placa").classList.toggle("fim", d.fim);
    const el = $("#placa-in"); el.style.animation = "none"; void el.offsetWidth; el.style.animation = "";
  }
  let timer;
  function dica(){ const d = $("#dica"); d.classList.remove("some"); clearTimeout(timer); timer = setTimeout(() => d.classList.add("some"), 4000); }
  document.addEventListener("click", () => { mostrar(atual + 1); dica(); });
  document.addEventListener("keydown", e => {
    if (e.key === "1") mostrar(0);
    else if (e.key === "2") mostrar(1);
    else if ([" ", "ArrowRight", "ArrowLeft", "Enter"].includes(e.key)) { e.preventDefault(); mostrar(atual + (e.key === "ArrowLeft" ? -1 : 1)); }
    else return;
    dica();
  });
  mostrar(atual); dica();
  // aviso de tela cheia: aparece no computador quando não está em tela cheia, e volta toda vez que sair dela
  const f11 = $("#aviso-f11");
  if (/Mac/i.test(navigator.platform || navigator.userAgent)) $("#f11-tecla").textContent = "Control + Command + F";
  const ehComputador = () => matchMedia("(pointer:fine)").matches && innerWidth > 700;
  const telaCheia = () => !!document.fullscreenElement || (innerHeight >= screen.height - 2 && innerWidth >= screen.width - 2);
  function checarF11(){ f11.hidden = !(ehComputador() && !telaCheia()); }
  let estava = telaCheia();
  function mudou(){ const agora = telaCheia(); if (agora) f11.hidden = true; else if (estava) checarF11(); estava = agora; }
  addEventListener("resize", () => setTimeout(mudou, 150));
  document.addEventListener("fullscreenchange", () => setTimeout(mudou, 150));
  f11.addEventListener("click", e => e.stopPropagation());
  $("#f11-fechar").onclick = () => { f11.hidden = true; };
  $("#f11-agora").onclick = () => { try { document.documentElement.requestFullscreen().catch(() => {}); } catch (x) {} f11.hidden = true; };
  checarF11();
</script>
</body>
</html>
